# # espanso match file
#
# # For a complete introduction, visit the official docs at: https://espanso.org/docs/
#
# # You can use this file to define the base matches (aka snippets)
# # that will be available in every application when using espanso.
#
# # Matches are substitution rules: when you type the "trigger" string
# # it gets replaced by the "replace" string.
#   # Simple text replacement
#   - trigger: ":espanso"
#     replace: "Hi there!"
#
#
#   # But matches can also be dynamic:
#
#   # Print the current date
#   - trigger: ":date"
#     replace: "{{mydate}}"
#     vars:
#       - name: mydate
#         type: date
#         params:
#           format: "%m/%d/%Y"
#
#   # Print the output of a shell command
#   - trigger: ":shell"
#     replace: "{{output}}"
#     vars:
#       - name: output
#         type: shell
#         params:
#           cmd: "echo 'Hello from your shell'"
#
#   # And much more! For more information, visit the docs: https://espanso.org/docs/
#
#   - trigger: ";hello"
#     replace: "hi there"

backend: inject

matches:
  - trigger: ";shr"
    replace: "¯\\_(ツ)_/¯"

  - trigger: ";cmd"
    replace: "⌘"

  - trigger: ";opt"
    replace: "⌥"

  - trigger: ";shi"
    replace: "⇧"

  - trigger: ";ctrl"
    replace: "⌃"

  - trigger: ";mods"
    replace: "⌃⌥⇧⌘"

  - trigger: ";up"
    replace: "↑"

  - trigger: ";left"
    replace: "←"

  - trigger: ";right"
    replace: "→"

  - trigger: ";down"
    replace: "↓"

  - trigger: ";ss"
    replace: "ss -tulpn"

  - trigger: ";tm"
    replace: "™"

  - trigger: ";->"
    replace: "→"

  - trigger: ";<-"
    replace: "←"

  - trigger: ";^^"
    replace: "↑"

  - trigger: ";vv"
    replace: "↓"

  - trigger: ";apple"
    replace: ""

  - trigger: ";capslock"
    replace: "⇪"

  - trigger: ";eject"
    replace: "⏏"

  - trigger: ";return"
    replace: "↩"

  - trigger: ";return"
    replace: "↵"

  - trigger: ";return"
    replace: "⏎"

  - trigger: ";enter"
    replace: "⌤"

  - trigger: ";backspace"
    replace: "⌫"

  - trigger: ";delete"
    replace: "⌦"

  - trigger: ";escape"
    replace: "⎋"

  - trigger: ";;;"
    replace: "⇞"

  - trigger: ";;;"
    replace: "⇟"

  - trigger: ";;;"
    replace: "↖"

  - trigger: ";;;"
    replace: "↘"

  - trigger: ";;;"
    replace: "⇥"

  - trigger: ";;;"
    replace: "⇤"

  - trigger: ";space"
    replace: "␣"

  - trigger: '"=='
    replace: "!="

  - replace: "😂"
    triggers: [":::", ":joy"]
    label: ":joy 😂"

  - replace: "😅"
    triggers: [":::", ":umm"]
    label: ":umm 😅"

  - replace: "🤣"
    triggers: [":::", ":lol"]
    label: ":lol 🤣"

  - replace: "👍"
    triggers: [":::", ":thup"]
    label: ":thup 👍"

  - replace: "🤔️"
    triggers: [":::", ":think"]
    label: ":think 🤔️"

  - replace: "😭️"
    triggers: [":::", ":sob"]
    label: ":sob 😭️"

  - replace: "🥰️"
    triggers: [":::", ":luv"]
    label: ":luv 🥰️"

  - replace: "😜️"
    triggers: [":::", ":nyah"]
    label: ":nyah 😜️"

  - replace: "🤯"
    triggers: [":::", ":boom"]
    label: ":boom"

  - replace: "➕"
    triggers: [":tasks", ":add"]
    label: ":add"

  - replace: "📅"
    triggers: [":tasks", ":due"]
    label: ":due"

  - replace: "⏳"
    triggers: [":tasks", ":sched"]
    label: ":sched"

  - replace: "🛫"
    triggers: [":tasks", ":start"]
    label: ":start"
